name: Redis-Cluster

services:
  redis:
    container_name: Redis-Cluster
    image: redis/redis-stack-server:latest
    mem_limit: 700m
    env_file: [env/redis.env]
    environment:
      TZ: Asia/Shanghai
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD -p $$REDIS_PORT ping | grep PONG"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
