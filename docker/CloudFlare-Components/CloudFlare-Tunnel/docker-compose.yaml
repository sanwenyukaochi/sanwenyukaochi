name: CloudFlare-Tunnel

services:
  CloudFlare-Tunnel:
    container_name: CloudFlare-Tunnel
    image: cloudflare/cloudflared:latest
    mem_limit: 200m
    environment:
      TZ: Asia/Shanghai
      TUNNEL_METRICS: ${TUNNEL_METRICS}
      NO_AUTOUPDATE: ${NO_AUTOUPDATE}
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_TRANSPORT_PROTOCOL}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: ["tunnel", "run"]
    network_mode: bridge
    ports:
      - "20241:20241/tcp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
