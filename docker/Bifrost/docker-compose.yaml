name: Bifrost

services:
  Bifrost:
    container_name: Bifrost
    image: maximhq/bifrost:v2.5.1
    mem_limit: 256m
    environment:
      TZ: Asia/Shanghai
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN}
      LOG_LEVEL: info
      LOG_STYLE: json
    volumes: [Bifrost-Data:/app/data]
    network_mode: bridge
    ports:
      - "8080:8080/tcp"
    restart: no
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"

volumes:
  Bifrost-Data:
    name: Bifrost-Data
